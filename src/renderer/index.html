<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'"
  />
  <title>AndroidRemote</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">

    <!-- ── แถบหัวหน้าต่าง (วาดเอง frame:false) ── -->
    <div class="titlebar metal">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#2f4a6d" stroke-width="1.3">
        <rect x="4.5" y="1.5" width="7" height="13" rx="1.6" fill="#dfe7f2"></rect>
        <line x1="6.6" y1="12.6" x2="9.4" y2="12.6" stroke-linecap="round"></line>
      </svg>
      <div class="titlebar__text" id="title-text">AndroidRemote</div>
      <div class="titlebar__buttons">
        <div class="capbtn" id="btn-min" title="ย่อ">
          <div style="width:9px;height:2px;background:#3a3b48;margin-top:7px"></div>
        </div>
        <div class="capbtn" id="btn-max" title="ขยาย">
          <div style="width:9px;height:8px;border:1px solid #3a3b48;border-top-width:2px"></div>
        </div>
        <div class="capbtn capbtn--close" id="btn-close" title="ปิด">
          <svg width="9" height="9" viewBox="0 0 10 10" stroke="#fff" stroke-width="1.9" stroke-linecap="round">
            <line x1="1.6" y1="1.6" x2="8.4" y2="8.4"></line><line x1="8.4" y1="1.6" x2="1.6" y2="8.4"></line>
          </svg>
        </div>
      </div>
    </div>

    <!-- ── เมนู ── -->
    <div class="menubar">
      <div class="menubar__item">แฟ้ม</div>
      <div class="menubar__item">อุปกรณ์</div>
      <div class="menubar__item">มุมมอง</div>
      <div class="menubar__item">เครื่องมือ</div>
      <div class="menubar__item">วิธีใช้</div>
    </div>

    <!-- ── แถบเครื่องมือ ── -->
    <div class="toolbar metal-tall">
      <div class="tbtn" id="btn-refresh" title="ตรวจเครื่องใหม่">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#33506f" stroke-width="1.35" stroke-linecap="round">
          <path d="M13.2 7.4a5.3 5.3 0 1 1-1.7-3.7"></path><path d="M13.4 2.1v3.1h-3.1"></path>
        </svg>
        ตรวจใหม่
      </div>
      <div class="tbtn" id="btn-emulator" title="สร้าง/จัดการเครื่องจำลอง (Nox)">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#33506f" stroke-width="1.35">
          <rect x="1.6" y="2.4" width="12.8" height="9" rx="1.3" fill="#e4ecf6"></rect>
          <line x1="5.4" y1="13.6" x2="10.6" y2="13.6" stroke-linecap="round"></line>
          <line x1="8" y1="11.4" x2="8" y2="13.6"></line>
          <path d="M8 5v3.2M6.4 6.6h3.2" stroke-linecap="round"></path>
        </svg>
        จำลอง
      </div>
      <div class="tbtn" id="btn-wireless" title="ต่อผ่าน Wi-Fi">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#33506f" stroke-width="1.35" stroke-linecap="round">
          <path d="M2.2 6.2a8.4 8.4 0 0 1 11.6 0"></path><path d="M4.6 8.8a5 5 0 0 1 6.8 0"></path>
          <circle cx="8" cy="11.9" r="1.25" fill="#33506f" stroke="none"></circle>
        </svg>
        ไร้สาย
      </div>
      <div class="tsep"></div>
      <div class="tbtn" id="btn-mirror" title="เริ่ม/หยุดมิเรอร์">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#33506f" stroke-width="1.35">
          <rect x="4.6" y="1.6" width="6.8" height="12.8" rx="1.5" fill="#e6edf7"></rect>
          <line x1="6.7" y1="12.4" x2="9.3" y2="12.4" stroke-linecap="round"></line>
        </svg>
        มิเรอร์
      </div>
      <div class="tbtn" id="btn-camera" title="ใช้กล้องมือถือแทนเว็บแคม">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#33506f" stroke-width="1.35">
          <rect x="1.6" y="4.2" width="12.8" height="9.2" rx="1.6" fill="#e4ecf6"></rect>
          <path d="M5.6 4.2 6.7 2.4h2.6l1.1 1.8" stroke-linejoin="round"></path>
          <circle cx="8" cy="8.8" r="2.6"></circle>
        </svg>
        กล้อง
      </div>
      <div class="tbtn" id="btn-macro" title="บันทึกมาโคร เล่นซ้ำหลายเครื่อง ตั้งเวลา">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#33506f" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="8" r="6.2" fill="#e4ecf6"></circle>
          <path d="M6.4 5.4v5.2l4.2-2.6z" fill="#33506f" stroke="none"></path>
        </svg>
        มาโคร
      </div>
      <div class="tbtn" id="btn-gamepad" title="ทำให้มือถือเป็นจอยเกม">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#33506f" stroke-width="1.35">
          <rect x="1.4" y="5" width="13.2" height="7.4" rx="3.2" fill="#e4ecf6"></rect>
          <line x1="5" y1="8.7" x2="7" y2="8.7" stroke-linecap="round"></line>
          <line x1="6" y1="7.7" x2="6" y2="9.7" stroke-linecap="round"></line>
          <circle cx="10.4" cy="8" r=".9" fill="#33506f" stroke="none"></circle>
          <circle cx="11.8" cy="9.4" r=".9" fill="#33506f" stroke="none"></circle>
        </svg>
        จอย
      </div>
      <div class="tsep"></div>
      <div class="tbtn" id="btn-pin" title="ปักหมุดไว้บนสุด">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#33506f" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 1.9h4l-.6 3.6 2.4 2.2H4.2l2.4-2.2z" fill="#c9dcef"></path><path d="M8 7.7v6.4"></path>
        </svg>
      </div>
      <div class="tbtn" id="btn-log" title="เปิดโฟลเดอร์ไฟล์ log — ส่งไฟล์นี้มาเวลาแจ้งปัญหา">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#33506f" stroke-width="1.35" stroke-linejoin="round">
          <path d="M3 2.4h6.4l3.6 3.6v7.6a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.4a1 1 0 0 1 1-1z" fill="#e4ecf6"></path>
          <path d="M9.4 2.4V6h3.6"></path>
          <line x1="4.6" y1="8.6" x2="11.4" y2="8.6" stroke-linecap="round"></line>
          <line x1="4.6" y1="11" x2="9.6" y2="11" stroke-linecap="round"></line>
        </svg>
      </div>
      <div class="tbtn" id="btn-restart-adb" title="รีสตาร์ท adb server">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#8d3a2f" stroke-width="1.35" stroke-linecap="round">
          <path d="M8 2.4v5.4"></path><path d="M4.6 4.6a4.8 4.8 0 1 0 6.8 0"></path>
        </svg>
      </div>

      <div style="flex:1"></div>
      <div id="adb-badge" style="display:flex;align-items:center;gap:6px;padding-right:2px;color:#4a4b5a"></div>
    </div>

    <!-- ── ตัวเนื้อหา ── -->
    <div class="body">
      <div class="panel-left metal-tall">
        <div class="gbox">
          <div class="gbox__title">อุปกรณ์</div>
          <div class="devlist sunken" id="devlist"></div>
        </div>
        <div id="device-detail"></div>
        <div style="flex:1"></div>
      </div>

      <div class="stage" id="stage"></div>

      <div class="panel-right metal-tall">
        <div class="gbox">
          <div class="gbox__title">ทำอะไรได้บ้าง</div>
          <div class="caps" id="caps"></div>
        </div>
        <div class="gbox">
          <div class="gbox__title">บันทึกเหตุการณ์</div>
          <div class="logbox sunken" id="logbox"></div>
        </div>
        <div style="flex:1"></div>
      </div>
    </div>

    <!-- ── แถบสถานะ ── -->
    <div class="statusbar metal-tall">
      <div class="statusbar__main">
        <div class="dot" id="status-dot" style="background:#8b8c9e"></div>
        <span id="status-text">กำลังเริ่มต้น…</span>
      </div>
      <div style="flex:1"></div>
      <div class="cell" id="status-count">0 เครื่อง</div>
      <div class="cell" id="status-tier">—</div>
      <div class="cell" id="status-update" hidden></div>
      <div class="cell" id="status-adb">adb —</div>
    </div>
  </div>

  <div id="modal-root"></div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
