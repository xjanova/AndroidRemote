name: ปล่อยรุ่น

# ปล่อยเมื่อดัน tag ที่ขึ้นต้นด้วย v เท่านั้น เช่น v0.2.0
# เวอร์ชันของทั้งตัวติดตั้งและ APK มาจาก tag นี้ที่เดียว จะได้ไม่มีทางไม่ตรงกัน
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'เวอร์ชันที่จะปล่อย (ไม่ต้องมี v)'
        required: true

permissions:
  contents: write

jobs:
  release:
    # ต้องเป็น Windows เพราะตัวฉีดคีย์คอมไพล์ด้วย csc.exe ที่มีเฉพาะบน Windows
    # และตัวติดตั้ง NSIS ก็ต้อง build บน Windows เหมือนกัน
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: หาเวอร์ชันจาก tag
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ปล่อยรุ่น $VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: ติดตั้ง Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - run: npm ci

      - name: ตั้งเวอร์ชันให้ตรงกับ tag
        shell: bash
        # 🔑 ต้องทำก่อน build ทุกอย่าง — ถ้าเวอร์ชันใน package.json ไม่ตรงกับ tag
        #    latest.yml จะบอกเวอร์ชันหนึ่งแต่ตัวแอปรายงานอีกเวอร์ชัน
        #    แล้ววงจรอัปเดตจะพังแบบเงียบ ๆ (เด้งให้อัปเดตซ้ำไม่จบ)
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: สร้าง server ฝั่ง Android
        run: npm run server:build

      - name: สร้างตัวฉีดคีย์
        run: npm run helper:build

      - name: ตรวจชนิดและ bundle
        run: npm run build

      - name: เตรียมกุญแจเซ็น APK
        id: keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ไม่มี secret ANDROID_KEYSTORE_BASE64 — จะข้ามการสร้าง APK"
            echo "::warning::สร้างกุญแจด้วย node scripts/make-release-key.mjs แล้วตั้ง secret ก่อน"
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: สร้าง APK แอปคู่หู
        if: steps.keystore.outputs.has_key == 'true'
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run apk:build

      - name: สร้างตัวติดตั้ง Windows แล้วปล่อยขึ้น Release
        env:
          # electron-builder ใช้โทเคนนี้สร้าง Release พร้อมอัปโหลด latest.yml
          # ซึ่งเป็นไฟล์ที่ electron-updater ใช้เช็คเวอร์ชัน ขาดไม่ได้
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ไม่มีใบรับรองเซ็นโค้ด — บอกให้ข้ามไปเลย ไม่ต้องเสียเวลาไปหา
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --x64 --publish always

      - name: แนบ APK เข้า Release เดียวกัน
        if: steps.keystore.outputs.has_key == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "v${{ steps.version.outputs.version }}" \
            "release/AndroidRemote-companion.apk" --clobber

      - name: เขียนรายละเอียดรุ่น
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        # ⚠ ไม่ใช้ generate_release_notes ของ GitHub โดยตั้งใจ
        #   มันเติมบรรทัด "Full Changelog: https://github.com/..." ให้เอง
        #   ซึ่งเคยหลุดไปโผล่ในกล่องอัปเดตที่ผู้ใช้เห็นมาแล้ว
        run: |
          cat > notes.md <<'EOF'
          ## ติดตั้งบน PC
          โหลด `AndroidRemote-<เวอร์ชัน>-setup.exe` แล้วเปิด
          ติดตั้งครั้งเดียว รุ่นถัดไปแอปจะเช็คและอัปเดตให้เอง

          ## แอปคู่หูบนมือถือ (ไม่บังคับ)
          โหลด `AndroidRemote-companion.apk` — มีไว้เพื่อให้การต่อไร้สาย
          รอดการรีบูตโดยไม่ต้องเสียบสาย USB ใหม่ ต้องมี root ถึงจะทำงานเต็มที่
          ฟีเจอร์หลัก (มิเรอร์ กล้อง จอย) ไม่ต้องลงแอปนี้ก็ใช้ได้ครบ
          EOF
          gh release edit "v${{ steps.version.outputs.version }}" --notes-file notes.md
