appId: com.xman.androidremote
productName: AndroidRemote
copyright: © xman

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  - '!**/*.map'

# ของที่ต้องวางข้างตัวโปรแกรม ไม่ใช่ยัดใน asar — เพราะเราส่งไฟล์เหล่านี้เข้ามือถือ
# และสั่งรันเป็นโพรเซสแยก ซึ่งทำกับไฟล์ใน asar ไม่ได้
extraResources:
  - from: resources/androidremote-server.jar
    to: androidremote-server.jar
  - from: resources/inputhelper.exe
    to: inputhelper.exe

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup.${ext}
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true

  # 🔑 ห้ามตั้งเป็น false — โน้ต 2026-08-23 masternode:
  #    allowToChangeInstallationDirectory: false ทำให้ $isTryToKeepShortcuts เป็น "true" เสมอ
  #    แล้วติดกับดัก keepShortcuts ทุกรอบอัปเดต จนไอคอนเดสก์ท็อปหายถาวร
  allowToChangeInstallationDirectory: true

  # 🔑 "always" ไม่ใช่ true — true แปลว่า "สร้างตอนติดตั้งครั้งแรกเท่านั้น"
  #    (นี่คือชั้นที่ 1 ชั้นที่ 2 อยู่ในโค้ดแอป ดู src/main/update/AutoUpdate.ts
  #     เพราะสาขานี้ยังมี ${ifNot} ${isUpdated} คร่อม = สายอัปเดตอัตโนมัติไม่สร้างให้)
  createDesktopShortcut: always
  createStartMenuShortcut: true

  shortcutName: AndroidRemote
  deleteAppDataOnUninstall: false
  runAfterFinish: true

publish:
  provider: github
  owner: xjanova
  repo: AndroidRemote
  # 🔑 ค่าเริ่มต้นของ electron-builder คือ draft ซึ่ง **electron-updater มองไม่เห็น**
  #    ปล่อยไว้แบบนั้น = ตัวติดตั้งขึ้น Release แล้วแต่ไม่มีเครื่องไหนอัปเดตได้เลย
  #    และไม่มี error อะไรให้เห็นด้วย แอปจะรายงานแค่ว่าเป็นเวอร์ชันล่าสุดแล้ว
  releaseType: release
